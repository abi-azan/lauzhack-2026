<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2D327D"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#EB0000"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- title -->
  <text x="60" y="78" font-size="40" font-weight="700" fill="#141414">We don't replace SBB's systems. We sit between them.</text>
  <text x="60" y="120" font-size="22" fill="#5A5A5A">Between the ticker the control centre already writes and the channels SBB already uses.</text>

  <!-- ===== column 1: IN ===== -->
  <text x="60" y="185" font-size="16" font-weight="700" fill="#767676" letter-spacing="1">WHAT SBB ALREADY HAS</text>
  <rect x="60" y="200" width="430" height="560" rx="14" fill="#F6F6F6"/>

  <rect x="85" y="225" width="380" height="88" rx="10" fill="#FFFFFF" stroke="#2D327D" stroke-width="2"/>
  <text x="105" y="261" font-size="22" font-weight="700" fill="#141414">KULT internal ticker</text>
  <text x="105" y="291" font-size="17" fill="#5A5A5A">Control-centre staff messages</text>

  <rect x="85" y="330" width="380" height="88" rx="10" fill="#FFFFFF" stroke="#2D327D" stroke-width="2"/>
  <text x="105" y="366" font-size="22" font-weight="700" fill="#141414">VIA disruption events</text>
  <text x="105" y="396" font-size="17" fill="#5A5A5A">Which line, which section, since when</text>

  <rect x="85" y="435" width="380" height="88" rx="10" fill="#FFFFFF" stroke="#2D327D" stroke-width="2"/>
  <text x="105" y="471" font-size="22" font-weight="700" fill="#141414">Public live ticker</text>
  <text x="105" y="501" font-size="17" fill="#5A5A5A">What SBB has said so far</text>

  <rect x="85" y="560" width="380" height="170" rx="10" fill="#2D327D"/>
  <text x="105" y="598" font-size="21" font-weight="700" fill="#FFFFFF">Events on a queue</text>
  <text x="105" y="630" font-size="17" fill="#FFFFFF">Demo: a Redis stream, fed by the</text>
  <text x="105" y="654" font-size="17" fill="#FFFFFF">real 17 Sep 2026 data, replayed.</text>
  <text x="105" y="688" font-size="17" fill="#C9CBE3">Production: subscribe to SBB's</text>
  <text x="105" y="712" font-size="17" fill="#C9CBE3">own event stream. Nothing changes.</text>
  <line x1="275" y1="523" x2="275" y2="556" stroke="#2D327D" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- arrow 1 → 2 -->
  <line x1="495" y1="645" x2="548" y2="645" stroke="#2D327D" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- ===== column 2: OUR LAYER ===== -->
  <text x="555" y="185" font-size="16" font-weight="700" fill="#EB0000" letter-spacing="1">OUR LAYER</text>
  <rect x="555" y="200" width="490" height="560" rx="14" fill="#FFF1F1" stroke="#EB0000" stroke-width="3"/>

  <g font-size="19" fill="#141414">
    <circle cx="595" cy="252" r="17" fill="#EB0000"/><text x="595" y="259" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="625" y="248" font-weight="700">Incident opens by itself</text>
    <text x="625" y="274" font-size="17" fill="#5A5A5A">for exactly the affected trains</text>

    <circle cx="595" cy="342" r="17" fill="#EB0000"/><text x="595" y="349" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="625" y="338" font-weight="700">Safety net within 60 s</text>
    <text x="625" y="364" font-size="17" fill="#5A5A5A">"Nothing more known yet. Next update by …"</text>

    <circle cx="595" cy="432" r="17" fill="#EB0000"/><text x="595" y="439" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="625" y="428" font-weight="700">AI drafts the update from the ticker</text>
    <text x="625" y="454" font-size="17" fill="#5A5A5A">staff names and phone numbers scrubbed</text>

    <circle cx="595" cy="522" r="17" fill="#EB0000"/><text x="595" y="529" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="625" y="518" font-weight="700">A human approves every word</text>
    <text x="625" y="544" font-size="17" fill="#5A5A5A">nothing reaches passengers unreviewed</text>

    <circle cx="595" cy="612" r="17" fill="#EB0000"/><text x="595" y="619" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="625" y="608" font-weight="700">Next move + chat, per passenger</text>
    <text x="625" y="634" font-size="17" fill="#5A5A5A">only from published updates + timetable</text>
    <text x="625" y="658" font-size="17" fill="#5A5A5A">no forecasting, every number sourced</text>
  </g>
  <text x="800" y="728" font-size="17" font-style="italic" fill="#EB0000" text-anchor="middle">One approved text, four languages</text>

  <!-- arrow 2 → 3 -->
  <line x1="1050" y1="470" x2="1103" y2="470" stroke="#EB0000" stroke-width="4" marker-end="url(#arrowRed)"/>

  <!-- ===== column 3: OUT ===== -->
  <text x="1110" y="185" font-size="16" font-weight="700" fill="#767676" letter-spacing="1">EVERY CHANNEL SBB ALREADY USES</text>
  <rect x="1110" y="200" width="430" height="560" rx="14" fill="#F6F6F6"/>

  <rect x="1135" y="225" width="380" height="100" rx="10" fill="#FFFFFF" stroke="#2D327D" stroke-width="2"/>
  <text x="1155" y="263" font-size="22" font-weight="700" fill="#141414">App push + incident page</text>
  <text x="1155" y="295" font-size="17" fill="#5A5A5A">Everyone checked in to the train</text>

  <rect x="1135" y="342" width="380" height="100" rx="10" fill="#FFFFFF" stroke="#2D327D" stroke-width="2"/>
  <text x="1155" y="380" font-size="22" font-weight="700" fill="#141414">Web status page</text>
  <text x="1155" y="412" font-size="17" fill="#5A5A5A">Public, no app needed</text>

  <rect x="1135" y="459" width="380" height="100" rx="10" fill="#FFFFFF" stroke="#2D327D" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="1155" y="497" font-size="22" font-weight="700" fill="#141414">Station displays</text>
  <text x="1155" y="529" font-size="17" fill="#5A5A5A">and announcements: same text, same moment</text>

  <rect x="1135" y="576" width="380" height="100" rx="10" fill="#FFFFFF" stroke="#2D327D" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="1155" y="614" font-size="22" font-weight="700" fill="#141414">Open data: SIRI-SX</text>
  <text x="1155" y="646" font-size="17" fill="#5A5A5A">opentransportdata.swiss, for other apps</text>

  <!-- feedback loop -->
  <path d="M1325,760 L1325,810 L275,810 L275,764" fill="none" stroke="#2D327D" stroke-width="3" stroke-dasharray="2 0" marker-end="url(#arrow)"/>
  <rect x="560" y="792" width="480" height="36" rx="18" fill="#FFFFFF"/>
  <text x="800" y="817" font-size="19" font-weight="700" fill="#2D327D" text-anchor="middle">Passenger questions, grouped → control centre</text>

  <!-- legend -->
  <rect x="60" y="852" width="34" height="22" rx="4" fill="#FFFFFF" stroke="#2D327D" stroke-width="2"/>
  <text x="104" y="869" font-size="17" fill="#5A5A5A">runs in today's demo</text>
  <rect x="300" y="852" width="34" height="22" rx="4" fill="#FFFFFF" stroke="#2D327D" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="344" y="869" font-size="17" fill="#5A5A5A">plugs in, not built</text>
</svg>
