<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica, Arial, sans-serif">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1600" height="8" fill="#EB0000"/>

  <!-- header -->
  <text x="60" y="66" font-size="18" font-weight="700" fill="#EB0000" letter-spacing="2">JETBRAINS · TEST EVIDENCE</text>
  <text x="60" y="124" font-size="50" font-weight="700" fill="#141414">Same tests, every target. 122 runs, 0 failures.</text>
  <text x="60" y="168" font-size="24" fill="#5A5A5A">The 43 commonTest tests run unchanged on the JVM and in headless Chrome (wasmJs).</text>

