  <!-- footer -->
  <rect x="60" y="790" width="1480" height="80" rx="8" fill="#F6F6F6"/>
  <text x="80" y="822" font-size="18" fill="#141414" font-family="DejaVu Sans Mono, Menlo, monospace">./gradlew :shared:allTests :admin:allTests :server:test</text>
  <text x="80" y="852" font-size="17" fill="#5A5A5A">22 Nov 2026, 05:36 CET, at 7db346a · JDK 21 · Chrome 157 · BUILD SUCCESSFUL in 43 s · counts from the JUnit XML reports</text>
