    <line x1="480" y1="520" x2="1540" y2="520" stroke="#E5E5E5" stroke-width="2"/>

    <!-- admin wasm -->
    <text x="480" y="570">wasmJs · headless Chrome</text>
    <rect x="1040" y="546" width="39" height="30" fill="#EB0000"/>
    <text x="1540" y="570" font-weight="700" text-anchor="end">4 / 4</text>
    <line x1="60" y1="600" x2="1540" y2="600" stroke="#D2D2D2" stroke-width="2"/>

    <!-- server -->
    <text x="60" y="650" font-weight="700">kmp/server</text>
    <text x="60" y="678" font-size="19" fill="#767676">Ktor end to end, chat, push, PII scrubbing</text>
    <text x="480" y="662">JVM</text>
    <rect x="1040" y="638" width="351" height="30" fill="#EB0000"/>
