  </g>
  <line x1="60" y1="256" x2="1540" y2="256" stroke="#141414" stroke-width="2"/>

  <!-- rows: each 92 tall -->
  <g font-size="26" fill="#141414">
    <!-- shared jvm -->
    <text x="60" y="306" font-weight="700">kmp/shared</text>
    <text x="60" y="334" font-size="19" fill="#767676">model, train matching, chat engine, nextMove()</text>
