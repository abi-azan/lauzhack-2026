    <line x1="480" y1="348" x2="1540" y2="348" stroke="#E5E5E5" stroke-width="2"/>

    <!-- shared wasm -->
    <text x="480" y="398">wasmJs · headless Chrome</text>
    <rect x="1040" y="374" width="380" height="30" fill="#EB0000"/>
    <text x="1540" y="398" font-weight="700" text-anchor="end">39 / 39</text>
    <line x1="60" y1="428" x2="1540" y2="428" stroke="#D2D2D2" stroke-width="2"/>

    <!-- admin desktop -->
    <text x="60" y="478" font-weight="700">kmp/admin</text>
